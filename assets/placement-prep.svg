<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Placement Prep</title><desc id="d">A campus placement platform with AI built into the workflow.. Role-based dashboards, eligibility checks and applications. Resume feedback, tool-calling assistant and semantic JD search. React interface, Spring Boot API and PostgreSQL with pgvector</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#111d31"/><stop offset="1" stop-color="#0c1322"/></linearGradient></defs><rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#g)" stroke="#2b3850"/><rect x="1" y="30" width="4" height="260" rx="2" fill="#67e8f9"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="44" fill="#67e8f9" font-size="12" letter-spacing="3">PROJECT 01</text><text x="36" y="96" fill="#f0f6ff" font-size="35" font-weight="700" letter-spacing="-1">Placement Prep</text><text x="37" y="129" fill="#b2c1d8" font-size="17">A campus placement platform with AI built into the workflow.</text><circle cx="41" cy="169" r="2.5" fill="#67e8f9"/><text x="55" y="175" fill="#d2ddef" font-size="15">Role-based dashboards, eligibility checks and applications</text><circle cx="41" cy="198" r="2.5" fill="#67e8f9"/><text x="55" y="204" fill="#d2ddef" font-size="15">Resume feedback, tool-calling assistant and semantic JD search</text><circle cx="41" cy="227" r="2.5" fill="#67e8f9"/><text x="55" y="233" fill="#d2ddef" font-size="15">React interface, Spring Boot API and PostgreSQL with pgvector</text><text x="37" y="282" fill="#67e8f9" font-size="12" letter-spacing="1.5">JAVA  /  SPRING AI  /  REACT  /  POSTGRESQL</text><path d="M818 44V277" stroke="#2b3850"/><text x="858" y="64" fill="#9caec8" font-size="11" letter-spacing="2">ENGINEERING HIGHLIGHT</text><text x="854" y="136" fill="#f0f6ff" font-size="64" font-weight="700">4 roles</text><text x="858" y="175" fill="#b2c1d8" font-size="16">One connected workflow.</text><text x